name: Rewrite BACKEND_TOML (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Transform and encrypt BACKEND_TOML
        env:
          BACKEND_TOML: ${{ secrets.BACKEND_TOML }}
          PUBLIC_KEY_B64: ""
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          workdir="$RUNNER_TEMP/backend-toml-secret"
          mkdir -p "$workdir"
          input="$workdir/input.toml"
          output="$workdir/output.toml"
          encrypted="$workdir/encrypted.json"
          printf '%s' "$BACKEND_TOML" > "$input"
          test -s "$input"

          python3 - "$input" "$output" <<'PYTHON'
          from __future__ import annotations
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          source, destination = map(Path, sys.argv[1:])
          domains = [
              "20130717.xyz",
              "260813.xyz",
              "7710011.xyz",
              "7710012.xyz",
              "7710014.xyz",
              "7710015.xyz",
              "7710016.xyz",
              "7710017.xyz",
              "771001.xyz",
              "jipeng.org",
          ]
          keys = ("DEFAULT_DOMAINS", "DOMAINS", "RANDOM_SUBDOMAIN_DOMAINS")
          text = source.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)

          vars_start = None
          vars_end = len(text)
          offset = 0
          for line in lines:
              stripped = line.strip()
              if vars_start is None and re.fullmatch(r"\[vars\](?:\s*#.*)?", stripped):
                  vars_start = offset + len(line)
              elif vars_start is not None and re.fullmatch(r"\[\[?[^\]\r\n]+\]\]?(?:\s*#.*)?", stripped):
                  vars_end = offset
                  break
              offset += len(line)
          if vars_start is None:
              raise SystemExit("missing [vars] table")

          body = text[vars_start:vars_end]

          def replace_array(body_text: str, key: str) -> str:
              assignment = re.compile(rf"(?m)^([ \t]*){re.escape(key)}([ \t]*=[ \t]*)")
              matches = list(assignment.finditer(body_text))
              if len(matches) != 1:
                  raise SystemExit(f"expected one [vars] assignment for {key}, found {len(matches)}")
              match = matches[0]
              cursor = match.end()
              while cursor < len(body_text) and body_text[cursor] in " \t":
                  cursor += 1
              if cursor >= len(body_text) or body_text[cursor] != "[":
                  raise SystemExit(f"{key} is not an array")
              start = cursor
              depth = 0
              quote = None
              escaped = False
              index = cursor
              end = None
              while index < len(body_text):
                  char = body_text[index]
                  if quote is not None:
                      if quote == '"' and escaped:
                          escaped = False
                      elif quote == '"' and char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                  elif char in ('"', "'"):
                      quote = char
                  elif char == "#":
                      newline = body_text.find("\n", index)
                      index = len(body_text) if newline == -1 else newline
                      continue
                  elif char == "[":
                      depth += 1
                  elif char == "]":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
                  index += 1
              if end is None:
                  raise SystemExit(f"unterminated array for {key}")
              return body_text[:start] + json.dumps(domains) + body_text[end:]

          updated_body = body
          for key in keys:
              updated_body = replace_array(updated_body, key)
          updated = text[:vars_start] + updated_body + text[vars_end:]
          parsed = tomllib.loads(updated)
          vars_table = parsed.get("vars")
          if not isinstance(vars_table, dict):
              raise SystemExit("[vars] table missing after update")
          for key in keys:
              if vars_table.get(key) != domains:
                  raise SystemExit(f"{key} verification failed")
          destination.write_text(updated, encoding="utf-8")
          PYTHON

          test -s "$output"
          node - "$input" "$output" "$encrypted" "$PUBLIC_KEY_B64" <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const [oldPath, newPath, outputPath, publicKeyB64] = process.argv.slice(2);
          const publicKey = Buffer.from(publicKeyB64, 'base64').toString('utf8');
          function encrypt(path) {
            const plaintext = fs.readFileSync(path);
            const key = crypto.randomBytes(32);
            const iv = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
            const ciphertext = Buffer.concat([cipher.update(plaintext), cipher.final()]);
            const wrappedKey = crypto.publicEncrypt({
              key: publicKey,
              padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
              oaepHash: 'sha256',
            }, key);
            return {
              wrapped_key: wrappedKey.toString('base64'),
              iv: iv.toString('base64'),
              tag: cipher.getAuthTag().toString('base64'),
              ciphertext: ciphertext.toString('base64'),
            };
          }
          fs.writeFileSync(outputPath, JSON.stringify({
            version: 1,
            algorithm: 'aes-256-gcm+rsa-oaep-sha256',
            old: encrypt(oldPath),
            transformed: encrypt(newPath),
          }, null, 2) + '\n', { mode: 0o600 });
          NODE

          test -s "$encrypted"
          python3 - "$input" "$output" <<'PYTHON_CLEANUP'
          from pathlib import Path
          import sys
          for value in sys.argv[1:]:
              Path(value).unlink(missing_ok=True)
          PYTHON_CLEANUP
      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: backend-toml-encrypted
          path: ${{ runner.temp }}/backend-toml-secret/encrypted.json
          if-no-files-found: error
          retention-days: 1
